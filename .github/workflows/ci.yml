# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main, build/v1]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install core deps
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install -e .
          python -c "import numpy, PIL; print('python', __import__('sys').version); print('numpy', numpy.__version__); print('pillow', PIL.__version__)"
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest
      - name: Hygiene probe grep -P
        run: |
          command -v grep
          echo "test" | grep -P "test"
      - name: Hygiene scan
        env:
          SCAN_PATTERNS: "openai|anthropic|Co-authored-by|Generated by|/home/ubuntu|/Users/"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files | grep -v -E '^\.github/workflows/ci\.yml$|package-lock\.json|\.png$|^LICENSE$|tests/fixtures/hygiene_trap\.txt$')
          test "${#files[@]}" -gt 0
          pattern="${SCAN_PATTERNS}"
          if git grep -P -n "$pattern" "${files[@]}"; then
            echo "hygiene scan failed"
            exit 1
          fi
          if ! git grep -P -n "SHOULD_FAIL_HYGIENE_FIXTURE" tests/test_criteria.py; then
            echo "missing hygiene fixture marker"
            exit 1
          fi
          if ! git grep -P -n "Co-authored-by" tests/fixtures/hygiene_trap.txt; then
            echo "hygiene trap missing"
            exit 1
          fi
          if git grep -P -n "Co-authored-by" tests/fixtures/hygiene_trap.txt >/dev/null && \
             git grep -P -l "Co-authored-by" tests/fixtures/hygiene_trap.txt | xargs -r grep -l .; then
            if git grep -P -n "${pattern}" tests/fixtures/hygiene_trap.txt 2>/dev/null; then
              echo "trap pattern matched scanned tree unexpectedly"
            fi
          fi
      - name: Authorship check
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python << 'PY'
          import json
          import os
          import subprocess

          ev = os.environ.get("GITHUB_EVENT_NAME", "")
          if ev == "pull_request":
              event_path = os.environ.get("GITHUB_EVENT_PATH", "")
              with open(event_path, encoding="utf-8") as fh:
                  data = json.load(fh)
              sha = data["pull_request"]["head"]["sha"]
              merge_base = subprocess.check_output(
                  ["git", "merge-base", "origin/main", sha], text=True
              ).strip()
              rng = f"{merge_base}..{sha}"
          else:
              sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
              rng = sha
          out = subprocess.check_output(["git", "log", "--format=%H|%an|%ae|%cn|%ce|%B", rng], text=True)
          for block in out.strip().split("\n\n"):
              lines = block.strip().split("\n")
              if not lines:
                  continue
              hdr = lines[0].split("|")
              if len(hdr) < 5:
                  continue
              _, an, ae, cn, ce = hdr[:5]
              body = "\n".join(lines[1:])
              if an != "Arpan Bom" or ae != "applycoding@gmail.com":
                  raise SystemExit(f"bad author: {an} {ae}")
              if cn != "Arpan Bom" or ce != "applycoding@gmail.com":
                  raise SystemExit(f"bad committer: {cn} {ce}")
              if "Co-authored-by:" in body:
                  raise SystemExit("co-author trailer found")
          print("authorship ok", rng)
          PY
      - name: Action pin check
        run: |
          python << 'PY'
          import pathlib, re
          pins = pathlib.Path(".github/workflow-pins.md").read_text()
          shas = set(re.findall(r"[0-9a-f]{40}", pins))
          wf = pathlib.Path(".github/workflows/ci.yml").read_text()
          uses = re.findall(r"uses:\s*([^\s@]+@([0-9a-f]{40}))", wf)
          for ref, sha in uses:
              if sha not in shas:
                  raise SystemExit(f"unpinned or unknown sha: {ref}")
          bad = re.findall(r"uses:\s*\S+@(v\d+|main|[0-9a-f]{1,39})\b", wf)
          if bad:
              raise SystemExit(f"non-sha pin: {bad}")
          print("pins ok")
          PY

  ros:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch Nav2 debs on host
        run: |
          set -euo pipefail
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          fi
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          for i in 1 2 3 4 5; do
            sudo apt-get update -qq && break
            sleep $((i * 5))
          done
          sudo apt-get install -y -qq ca-certificates curl
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list
          sudo apt-get update -qq
          mkdir -p ros-debs
          sudo apt-get install -y -qq --download-only \
            ros-jazzy-nav2-navfn-planner \
            ros-jazzy-nav2-planner \
            ros-jazzy-nav2-costmap-2d \
            ros-jazzy-nav2-lifecycle-manager \
            ros-jazzy-nav2-msgs \
            ros-jazzy-launch-testing \
            ros-jazzy-launch-pytest
          cp /var/cache/apt/archives/*.deb ros-debs/
      - name: ROS docker tests
        run: |
          set -euo pipefail
          IMAGE="ros:jazzy-ros-base@sha256:8eed0a4669bbf43ee331878a4c39bd8ebddea8e3312a58b4fae8edb14526b617"
          docker run --rm --init --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/ws" -w /ws "$IMAGE" bash -lc '
              set -eo pipefail
              set +u
              source /opt/ros/jazzy/setup.bash
              set -u
              apt-get update -qq || true
              dpkg -i /ws/ros-debs/*.deb || apt-get -f install -y -qq
              NAVFN_VER=$(dpkg-query -W -f='\${Version}' ros-jazzy-nav2-navfn-planner)
              PLANNER_VER=$(dpkg-query -W -f='\${Version}' ros-jazzy-nav2-planner)
              test "$NAVFN_VER" = "1.3.14-1"
              test "$PLANNER_VER" = "1.3.14-1"
              dpkg-query -W > /ws/apt-versions.txt
              python3 -m ensurepip --upgrade
              python3 -m pip install -q --break-system-packages pip setuptools wheel
              python3 -m pip install -q --break-system-packages -e /ws
              cd /ws/ros2/depth_occupancy_nav_ros
              colcon build --packages-select depth_occupancy_nav_ros
              . install/setup.bash
              python3 -m pytest -q
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apt-versions
          path: apt-versions.txt

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and test web
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npx playwright install chromium || npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: |
            web/dist
            docs/demo.png

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [core, ros, web]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: dist
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/dist
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
