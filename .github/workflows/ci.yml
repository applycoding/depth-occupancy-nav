# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NAV2_NAVFN_VER: "1.3.13-1noble.20260921.031752"
  NAV2_PLANNER_VER: "1.3.13-1noble.20260921.031801"
  NAV2_COSTMAP_VER: "1.3.13-1noble.20260921.024946"
  ROSDISTRO_KEY_URL: "https://raw.githubusercontent.com/ros/rosdistro/eb71c289f4495a0327cd03a29205a2c411cd8129/ros.asc"
  HYGIENE_PATTERN: "openai|anthropic|chatgpt|gpt-4|gpt-5|copilot|claude|Cursor Agent|cursor\\.com|Co-authored-by|Generated by|/home/ubuntu|/Users/|/workspace/|/tmp/"

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install core deps
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install -e .
      - name: Ruff
        run: ruff check src tests scripts
      - name: Pytest
        run: pytest
      - name: Hygiene probe grep -P
        run: |
          command -v grep
          echo "test" | grep -P "test"
      - name: Hygiene scan
        run: |
          set -euo pipefail
          python3 scripts/hygiene_scan.py
          set +e
          python3 scripts/hygiene_scan.py --trap
          rc=$?
          set -e
          test "$rc" -eq 1
          if ! git grep -P -n "SHOULD_FAIL_HYGIENE_FIXTURE" tests/test_criteria.py; then
            echo "missing hygiene fixture marker"
            exit 1
          fi
      - name: Authorship check
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 scripts/check_authorship.py --self-test
          sha=$(git rev-parse HEAD)
          new_range="5fcad2927246fa08150c0db116438e3c9f20a0d3..${sha}"
          python3 scripts/check_authorship.py "${new_range}" "${new_range}"
      - name: Action pin check
        run: |
          python << 'PY'
          import pathlib, re
          pins = pathlib.Path(".github/workflow-pins.md").read_text()
          shas = set(re.findall(r"[0-9a-f]{40}", pins))
          wf = pathlib.Path(".github/workflows/ci.yml").read_text()
          uses = re.findall(r"uses:\s*([^\s@]+@([0-9a-f]{40}))", wf)
          for ref, sha in uses:
              if sha not in shas:
                  raise SystemExit(f"unpinned or unknown sha: {ref}")
          bad = re.findall(r"uses:\s*\S+@(v\d+|main|[0-9a-f]{1,39})\b", wf)
          if bad:
              raise SystemExit(f"non-sha pin: {bad}")
          print("pins ok")
          PY

  ros:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Fetch Nav2 debs on host
        run: |
          set -euo pipefail
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          fi
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          for i in 1 2 3 4 5; do
            sudo apt-get update -qq && break
            sleep $((i * 5))
          done
          sudo apt-get install -y -qq ca-certificates curl gnupg
          curl -sSL "${ROSDISTRO_KEY_URL}" | gpg --dearmor | sudo tee /usr/share/keyrings/ros-archive-keyring.gpg > /dev/null
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list
          sudo apt-get update -qq
          mkdir -p ros-debs
          sudo apt-get install -y -qq --download-only \
            "ros-jazzy-nav2-navfn-planner=${NAV2_NAVFN_VER}" \
            "ros-jazzy-nav2-planner=${NAV2_PLANNER_VER}" \
            "ros-jazzy-nav2-costmap-2d=${NAV2_COSTMAP_VER}" \
            ros-jazzy-nav2-lifecycle-manager \
            ros-jazzy-nav2-msgs \
            ros-jazzy-launch-testing \
            ros-jazzy-launch-pytest
          cp /var/cache/apt/archives/*.deb ros-debs/
      - name: Stage Python wheels for container
        run: |
          python -m pip download -r requirements.txt --only-binary=:all: -d wheelhouse
          curl -fsSL https://bootstrap.pypa.io/get-pip.py -o get-pip.py
      - name: ROS docker tests
        run: |
          set -euo pipefail
          bash scripts/run_ros_tests.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apt-versions
          path: apt-versions.txt

  web:
    runs-on: ubuntu-24.04
    needs: [ros]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apt-versions
          path: .
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and test web
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        working-directory: web
        run: |
          set -euo pipefail
          cd ..
          python -m pip install -e . --quiet
          python scripts/write_report.py web/public
          cd web
          npm ci
          npm run typecheck
          npm test
          npm run build
          test -f dist/index.html
          test -f dist/report.json
          npx playwright install chromium || npx playwright install --with-deps chromium
          CI=1 npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-screenshot
          path: docs/demo.png

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [core, ros, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: dist
      - name: Verify site bundle
        run: |
          test -f dist/index.html
          test -f dist/report.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
